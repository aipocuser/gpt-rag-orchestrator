name: CodeQL report

on:
  push:
    branches:
      - 'codeql-report'
    
jobs:
  generate-report:
    name: Generate report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Install browser via puppeteer"
        run: npx puppeteer@23.1.1 browsers install chrome
    
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: GitHub Security Report Action   
        #uses: peter-murray/github-security-report-action@v2
        uses: PCStefan/github-security-report-action@v3
        with:
          outputDir: './security-reports'
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: ./security-reports/summary.pdf
